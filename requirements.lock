# requirements.lock: every runtime package pinned, transitive deps included.
#
# requirements.txt holds the human-edited ranges; this file is what the Docker image installs
# (Dockerfile: pip install -r requirements.txt -c requirements.lock), so two builds of the
# same commit get the same packages.
#
# Target: Linux x86_64/aarch64 (manylinux), CPython 3.13 -- the Dockerfile's deadsnakes
# python3.13. Markers for other platforms (python-magic-bin on win32, iso-639 on <3.12) are
# resolved away, so this lock is not meant for Windows or older Pythons.
#
# Versions were taken from the tested dev venv (also CPython 3.13) and resolved with:
#   pip list --format=freeze > /tmp/venv.txt
#   uv pip compile requirements.txt -c /tmp/venv.txt \
#       --python-version 3.13 --python-platform x86_64-manylinux_2_28 \
#       --no-header --annotation-style line -o requirements.lock
# then this header was prepended and the "-c /tmp/venv.txt" annotations stripped.
# To bump a package, change the pin here (or re-run the command against an updated venv);
# tests/unit/test_requirements_sync.py checks every requirement is pinned and in range.
