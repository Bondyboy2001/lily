<!DOCTYPE html>
<html class="no-js lily-reader-page">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>{{_('epub Reader')}} | {{title}}</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    {% if g.google_site_verification|length > 0 %}
    <meta name="google-site-verification" content="{{g.google_site_verification}}">
    {% endif %}
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/libs/normalize.css') }}">
    {# main.css still lays out the epub.js viewer; lily-reader.css restyles the chrome over it. #}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/popup.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lily.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lily-icons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lily-reader.css') }}">
</head>

<body class="lily-reader lily-epub">
    <div id="sidebar">
        <div id="panels">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="button" id="show-Toc" class="show_view reader-tab active" data-view="Toc">{{_('Contents')}}</button>
            <button type="button" id="show-Bookmarks" class="show_view reader-tab" data-view="Bookmarks">{{_('Bookmarks')}}</button>
            <button type="button" id="show-Search" class="show_view reader-tab" data-view="Search">{{_('Search')}}</button>
        </div>
        <div id="tocView" class="view">
        </div>
        <div id="searchView" class="view" data-searching="{{_('Searching…')}}" data-results="{{_('%(count)s results', count='%(count)s')}}"
             data-none="{{_('No Results')}}" data-short="{{_('Type at least two letters.')}}">
            <form id="searchForm" role="search">
                <input id="searchBox" type="search" placeholder="{{_('Search this book')}}" aria-label="{{_('Search this book')}}" autocomplete="off">
                <button type="submit" class="reader-btn" aria-label="{{_('Search')}}"><span class="glyphicon glyphicon-search" aria-hidden="true"></span></button>
            </form>
            <p id="searchStatus" aria-live="polite"></p>
            <ul id="searchResults"></ul>
        </div>
        <div id="bookmarksView" class="view">
            <ul id="bookmarks"></ul>
        </div>
    </div>
    <div id="main">

        <div id="titlebar">
            <div id="opener">
                <a id="back-button" class="reader-btn" href="{{ url_for('web.show_book', book_id=bookid) }}" aria-label="{{_('Back to book')}}" title="{{_('Back to book')}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span class="reader-btn-label">{{_('Book')}}</span></a>
                <button type="button" id="slider" class="reader-btn icon-menu" aria-label="{{_('Contents, bookmarks and search')}}" title="{{_('Contents, bookmarks and search')}}" aria-controls="sidebar"><span class="glyphicon glyphicon-menu-hamburger" aria-hidden="true"></span></button>
            </div>
            <div id="metainfo">
	            <span id="book-title"></span>
	            <span id="title-seperator">&nbsp;&nbsp;–&nbsp;&nbsp;</span>
	            <span id="chapter-title"></span>
	        </div>
	        <div id="title-controls">
	            <button type="button" id="bookmark" class="reader-btn icon-bookmark-empty" aria-label="{{_('Bookmark this page')}}" title="{{_('Bookmark this page')}}"><span class="glyphicon glyphicon-bookmark" aria-hidden="true"></span></button>
	            <button type="button" id="setting" class="reader-btn icon-cog" aria-label="{{_('Reader settings')}}" title="{{_('Reader settings')}}" aria-controls="settings-modal"><span class="glyphicon glyphicon-cog" aria-hidden="true"></span></button>
	            <button type="button" id="fullscreen" class="reader-btn icon-resize-full" aria-label="{{_('Fullscreen')}}" title="{{_('Fullscreen')}}"><span class="glyphicon glyphicon-fullscreen" aria-hidden="true"></span></button>
	        </div>
	    </div>

	    <div id="divider"></div>
	    <button type="button" id="prev" class="arrow" aria-label="{{_('Previous Page')}}">‹</button>
	    <div id="viewer"></div>
	    <button type="button" id="next" class="arrow" aria-label="{{_('Next Page')}}">›</button>
	    <div id="progress" aria-live="off">0%</div>
	    <div id="loader"><img src="{{ url_for('static', filename='img/loader.gif') }}" alt="{{_('Loading...')}}"></div>
	</div>
    <div class="modal md-effect-1" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="md-content">
            <h3 id="settings-title">{{_('Settings')}}</h3>
            <div class="reader-setting themes" id="themes">
                <span class="reader-setting-label">{{_('Theme')}}</span>
                <!-- The tick is set from the saved theme by markSelectedTheme() below and again by selectTheme() on startup -->
                <button type="button" id="lightTheme" class="lightTheme" onclick="selectTheme(this.id)"><span
                        id="lightSelected"></span>{{_('Light')}}</button>
                <button type="button" id="darkTheme" class="darkTheme" onclick="selectTheme(this.id)"><span
                        id="darkSelected"></span>{{_('Dark')}}</button>
                <button type="button" id="sepiaTheme" class="sepiaTheme" onclick="selectTheme(this.id)"><span
                        id="sepiaSelected"></span>{{_('Sepia')}}</button>
                <button type="button" id="blackTheme" class="blackTheme" onclick="selectTheme(this.id)"><span
                        id="blackSelected"></span>{{_('Black')}}</button>
            </div>
            <div class="reader-setting fontSizeWrapper">
                <label class="reader-setting-label" for="fontSizeFader">{{ _('Font Sizes') }}</label>
                <input type="range" min="75" max="200" value="100" id="fontSizeFader" step="25">
            </div>
            <div class="reader-setting font" id="font">
                <span class="reader-setting-label">{{_('Font')}}</span>
                <button type="button" id="default" onclick="selectFont(this.id)"><span>✓</span>{{_('Default')}}</button>
                <button type="button" id="Yahei" onclick="selectFont(this.id)"><span></span>{{_('Yahei')}}</button>
                <button type="button" id="SimSun" onclick="selectFont(this.id)"><span></span>{{_('SimSun')}}</button>
                <button type="button" id="KaiTi" onclick="selectFont(this.id)"><span></span>{{_('KaiTi')}}</button>
                <button type="button" id="Serif" onclick="selectFont(this.id)"><span></span>{{_('Serif')}}</button>
                <button type="button" id="SansSerif" onclick="selectFont(this.id)"><span></span>{{_('Sans-serif')}}</button>
                <button type="button" id="Arial" onclick="selectFont(this.id)"><span></span>{{_('Arial')}}</button>
            </div>
            <div class="reader-setting readerLayout" id="readerLayout">
                <label class="reader-setting-label" for="lineHeightSelect">{{_('Line spacing')}}</label>
                <select id="lineHeightSelect">
                  <option value="default">{{_('Default')}}</option>
                  <option value="1.2">1.2</option>
                  <option value="1.4">1.4</option>
                  <option value="1.6">1.6</option>
                  <option value="1.8">1.8</option>
                  <option value="2.0">2.0</option>
                </select>
                <label class="reader-setting-label" for="marginSelect">{{_('Margins')}}</label>
                <select id="marginSelect">
                  <option value="0">{{_('Default')}}</option>
                  <option value="1">{{_('Small')}}</option>
                  <option value="2">{{_('Medium')}}</option>
                  <option value="4">{{_('Large')}}</option>
                </select>
            </div>
            <div class="reader-setting layou" id="layout">
                <span class="reader-setting-label">{{ _('Spread') }}</span>
                <button type="button" id="spread" onclick="spread(this.id)"><span>✓</span>{{_('Two columns')}}</button>
                <button type="button" id="nonespread" onclick="spread(this.id)"><span></span>{{_('One column')}}</button>
            </div>
            <div class="reader-setting">
                <label class="reader-check" for="sidebarReflow"><input type="checkbox" id="sidebarReflow"
                        name="sidebarReflow">{{_('Reflow text when sidebars are open.')}}</label>
            </div>
            <button type="button" class="closer icon-cancel-circled" aria-label="{{_('Close')}}"><span class="glyphicon glyphicon-remove" aria-hidden="true"></span></button>
        </div>
    </div>
    <div class="overlay"></div>
    <script src="{{ url_for('static', filename='js/libs/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/libs/jquery-migrate.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/compress/jszip_epub.min.js') }}">
    </script>
    <script src="{{ url_for('static', filename='js/libs/epub.min.js') }}"></script>
    <script type="text/javascript">
        window.calibre = {
            filePath: "{{ url_for('static', filename='js/libs/') }}",
            cssPath: "{{ url_for('static', filename='css/') }}",
            bookmarkUrl: "{{ url_for('web.set_bookmark', book_id=bookid, book_format=book_format|upper) }}",
            bookUrl: "{{ url_for('web.serve_book', book_id=bookid, book_format=book_format, anyname='file.epub') }}",
            bookmark: "{{ bookmark.bookmark_key if bookmark != None }}",
            useBookmarks: "{{ current_user.is_authenticated | tojson }}",
            kosyncPercent: {{ kosync_progress | tojson if kosync_progress is not none else 'null' }},
            // Reading position sync (GET/POST {cfi, percent}); only for signed-in users.
            progressUrl: "{{ url_for('web.index') }}ajax/progress/{{ bookid }}",
            progressKey: "{{ bookid }}.{{ book_format }}",
            syncProgress: {{ current_user.is_authenticated | tojson }}
        };

        window.themes = {
            "darkTheme": {
                "bgColor": "#202124",
                "css_path": "{{ url_for('static', filename='css/epub_themes.css') }}",
                "title-color": "#fff"
            },
            "lightTheme": {
                "bgColor": "white",
                "css_path": "{{ url_for('static', filename='css/epub_themes.css') }}",
                "title-color": "#4f4f4f"
            },
            "sepiaTheme": {
                "bgColor": "#ece1ca",
                "css_path": "{{ url_for('static', filename='css/epub_themes.css') }}",
                "title-color": "#4f4f4f"
            },
            "blackTheme": {
                "bgColor": "black",
                "css_path": "{{ url_for('static', filename='css/epub_themes.css') }}",
                "title-color": "#fff"
            },
        };

        // CSS font stacks for the font buttons (ids). "default" keeps the book's own font.
        // Only locally installed fonts are used - nothing is fetched from a CDN.
        window.readerFontStacks = {
            "Serif": 'Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Times New Roman", serif',
            "SansSerif": 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif',
            "Yahei": '"Microsoft YaHei", sans-serif',
            "SimSun": 'SimSun, serif',
            "KaiTi": 'KaiTi, serif',
            "Arial": 'Arial, Helvetica, sans-serif'
        };

        function markSelectedTheme (id) {
            let themeButton = themes[id] ? document.getElementById(id) : null;
            if (!themeButton) {
              return false;
            }
            // Remove tick mark from all theme buttons
            document.getElementById("themes").querySelectorAll("span").forEach(function (tickSpan) {
              tickSpan.textContent = "";
            });
            // Add tick mark to the button corresponding to the currently selected theme
            themeButton.querySelector("span").textContent = "✓";
            return true;
        }

        function selectTheme (id) {
            if (!markSelectedTheme(id)) {
              id = "lightTheme";
              markSelectedTheme(id);
            }
            // Saving theme to local storage
            localStorage.setItem("calibre.reader.theme", id);
            // Apply theme to epubjs iframe
            reader.rendition.themes.select(id);
            // Apply theme to rest of the page. 
            document.getElementById("main").style.backgroundColor = themes[id]["bgColor"];
            // The toolbar and page arrows follow the page colours.
            document.getElementById("main").style.color = themes[id]["title-color"] || "#fff";
            document.getElementById("titlebar").style.color = themes[id]["title-color"] || "#fff";
          }

        // Font size and font logic (wait for reader to be ready)
        let defaultFont;
        window.selectFont = function(id) {
          if (!defaultFont) {
            try {
              defaultFont = reader.rendition.getContents()[0]?.css('font-family');
            } catch (e) { defaultFont = null; }
          }
          let spans = document.getElementById("font").querySelectorAll("span");
          for(var i = 0; i < spans.length; i++) {
            spans[i].textContent = "";
          }
          let fontButton = document.getElementById(id);
          if (!fontButton || (id !== 'default' && !readerFontStacks[id])) {
            id = 'default';
            fontButton = document.getElementById(id);
          }
          fontButton.querySelector("span").textContent = "✓";
          localStorage.setItem("calibre.reader.font", id);
          if (id == 'default') {
            if (defaultFont) {
              reader.rendition.themes.font(defaultFont);
            }
            return;
          }
          reader.rendition.themes.font(readerFontStacks[id]);
        }

        window.spread = function(id) {
          let spans = document.getElementById("layout").querySelectorAll("span");
          for(var i = 0; i < spans.length; i++) {
            spans[i].textContent = "";
          }
          document.getElementById(id).querySelector("span").textContent = "✓";
          localStorage.setItem("calibre.reader.spread", id);
          reader.rendition.spread(id==='spread'?true:'none');
        }

        // Font size slider logic
        document.addEventListener("DOMContentLoaded", function() {
          let fontSizeFader = document.getElementById('fontSizeFader');
          if (fontSizeFader) {
            let savedFontSize = localStorage.getItem("calibre.reader.fontSize");
            if (savedFontSize) {
              fontSizeFader.value = savedFontSize;
            }
            fontSizeFader.addEventListener("change", function () {
              reader.rendition.themes.fontSize(`${this.value}%`);
              localStorage.setItem("calibre.reader.fontSize", this.value);
            });
          }
        });

        // Reflow logic
        document.addEventListener("DOMContentLoaded", function() {
          let reflowBox = document.getElementById('sidebarReflow');
          if (reflowBox) {
            let savedReflow = localStorage.getItem("calibre.reader.reflow");
            if (savedReflow !== null) {
              reflowBox.checked = savedReflow === 'true';
            }
            reflowBox.addEventListener("change", function() {
              localStorage.setItem("calibre.reader.reflow", this.checked);
            });
          }
        });

        // Show the saved theme's tick straight away, before the reader has finished loading
        document.addEventListener("DOMContentLoaded", function() {
          markSelectedTheme(localStorage.getItem("calibre.reader.theme") || "lightTheme") || markSelectedTheme("lightTheme");
        });
      </script>
      <script src="{{ url_for('static', filename='js/libs/screenfull.min.js') }}"></script>
      <script src="{{ url_for('static', filename='js/libs/reader.min.js') }}"></script>
      <script src="{{ url_for('static', filename='js/reading/epub.js') }}"></script>
      <script src="{{ url_for('static', filename='js/reading/progress-sync.js') }}"></script>
      <script src="{{ url_for('static', filename='js/reading/epub-progress.js') }}"></script>
      <script src="{{ url_for('static', filename='js/reading/epub-search.js') }}"></script>
    </body>
</html>
