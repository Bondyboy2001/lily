{% extends "layout.html" %}
{% block body %}
<div style="background-color: rgba(0, 0, 0, .4);
    border: none;
    padding-bottom: 4rem;
    margin: 0;
    margin-top: 8rem;
    height: fit-content;" class="well col-sm-6 col-sm-offset-2">
  <h2 style="margin-top: 0">{{_('Change Password')}}</h2>
  {% if forced %}
  <p style="color: var(--color-primary)">{{_('You are still using the default password. Please choose a new password before continuing.')}}</p>
  {% endif %}
  <form method="POST" role="form" style="background: none;" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="current_password" style="color: var(--color-primary)">{{_('Current Password')}}</label>
      <input type="password" class="form-control" id="current_password" name="current_password" required autocomplete="current-password">
    </div>
    <div class="form-group">
      <label for="new_password" style="color: var(--color-primary)">{{_('New Password')}}</label>
      <input type="password" class="form-control" id="new_password" name="new_password" required autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="confirm_password" style="color: var(--color-primary)">{{_('Confirm New Password')}}</label>
      <input type="password" class="form-control" id="confirm_password" name="confirm_password" required autocomplete="new-password">
    </div>
    <button type="submit" name="submit" class="btn btn-default">{{_('Change Password')}}</button>
    <a href="{{ url_for('web.logout') }}" class="btn btn-default">{{_('Logout')}}</a>
  </form>
</div>
{% endblock %}
