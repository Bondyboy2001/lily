{% extends "layout.html" %}
{% block body %}

<script>
// Lazy chart init registry: each tab partial registers its init / resize function here
// (instead of initialising on DOMContentLoaded) so charts are only built when their tab is shown.
window.lilyStatsTabInit = {};
window.lilyStatsTabResize = {};
window.lilyStatsTabInitDone = {};
</script>

<style>
    .stats-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        border-bottom: 2px solid #3a4451;
        padding-bottom: 0;
    }
    
    .stats-tab {
        background: none;
        border: none;
        padding: 15px 30px;
        font-size: 1.1em;
        font-weight: 600;
        color: #aaa;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all 0.3s ease;
        position: relative;
        bottom: -2px;
    }
    
    .stats-tab:hover {
        color: #ff9800;
        background: rgba(255, 152, 0, 0.05);
    }
    
    .stats-tab.active {
        color: #ff9800;
        border-bottom-color: #ff9800;
        background: rgba(255, 152, 0, 0.1);
    }
    
    .tab-content {
        display: none;
    }
    
    .tab-content.active {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="discover" style="margin-top: 1rem !important;">
    <h2>{{title}}</h2>
    
    <!-- Tab Navigation -->
    <div class="stats-tabs">
        <button class="stats-tab {{ 'active' if active_tab == 'activity' else '' }}" 
                onclick="switchTab('activity')">
            📊 User Activity
        </button>
        <button class="stats-tab {{ 'active' if active_tab == 'library' else '' }}" 
                onclick="switchTab('library')">
            📚 Library Stats
        </button>
        <button class="stats-tab {{ 'active' if active_tab == 'api' else '' }}" 
                onclick="switchTab('api')">
            📱 API Usage
        </button>
        <button class="stats-tab {{ 'active' if active_tab == 'system' else '' }}" 
                onclick="switchTab('system')">
            ⚙️ System Stats
        </button>
    </div>

    <div style="max-width: 1200px; margin: auto;">
        <!-- User Activity Tab -->
        <div id="activity-tab" class="tab-content {{ 'active' if active_tab == 'activity' else '' }}">
            {% include 'cwa_user_activity.html' %}
        </div>
        
        <!-- Library Stats Tab -->
        <div id="library-tab" class="tab-content {{ 'active' if active_tab == 'library' else '' }}">
            {% include 'cwa_library_stats.html' %}
        </div>
        
        <!-- API Usage Tab -->
        <div id="api-tab" class="tab-content {{ 'active' if active_tab == 'api' else '' }}">
            {% include 'cwa_api_stats.html' %}
        </div>
        
        <!-- System Logs Tab -->
        <div id="system-tab" class="tab-content {{ 'active' if active_tab == 'system' else '' }}">
            {% include 'cwa_stats_system.html' %}
        </div>
    </div>
    
</div>

<script>
// Initialise a tab's charts the first time it is visible; resize them on later visits.
// Returns true if this call initialised the tab.
function lilyStatsActivateTab(tabName) {
    if (window.lilyStatsTabInitDone[tabName]) return false;
    const init = window.lilyStatsTabInit[tabName];
    if (typeof init !== 'function' || typeof echarts === 'undefined') return false;
    window.lilyStatsTabInitDone[tabName] = true;
    init();
    return true;
}

// echarts is loaded with `defer`, so it is available by DOMContentLoaded.
document.addEventListener('DOMContentLoaded', function() {
    const active = document.querySelector('.tab-content.active');
    if (active) lilyStatsActivateTab(active.id.replace(/-tab$/, ''));
});

function switchTab(tabName) {
    // Update tab buttons
    document.querySelectorAll('.stats-tab').forEach(tab => {
        tab.classList.remove('active');
    });
    event.currentTarget.classList.add('active');
    
    // Update tab content
    document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
    });
    document.getElementById(tabName + '-tab').classList.add('active');
    
    // Update URL without page reload
    const url = new URL(window.location);
    url.searchParams.set('tab', tabName);
    window.history.pushState({}, '', url);
    
    // First visit: build the charts now that the tab is visible (correct sizes).
    // Later visits: resize charts in case the window changed size while hidden.
    if (!lilyStatsActivateTab(tabName)) {
        const resize = window.lilyStatsTabResize[tabName];
        if (typeof resize === 'function') setTimeout(resize, 50); // Small delay to ensure DOM has updated
    }
}
</script>

{% endblock %}

{% block js %}
<script defer src="{{ url_for('static', filename='js/libs/echarts.min.js') }}"></script>
{% endblock %}
