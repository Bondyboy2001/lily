{# A failed bookmark save, removal or load, said quietly in the reader (bookmarks.js). #}
<p id="bookmark-status" class="lily-bookmark-status" role="status" aria-live="polite"
   data-load-failed="{{_('Bookmarks could not be loaded. Reload the page to try again.')}}"
   data-save-failed="{{_('The bookmark was not saved. Check the connection and try again.')}}"
   data-remove-failed="{{_('The bookmark was not removed. Check the connection and try again.')}}"></p>
