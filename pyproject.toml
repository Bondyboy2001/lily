[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lily"
description = "Lily: a personal redesign of Calibre-Web Automated, a self-hosted ebook library"
authors = [{name = "CrocodileStick", email = "crocodilestick@users.noreply.github.com"}]
maintainers = [{name = "Bondyboy2001"}]
license = {text = "GPLv3+"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = [
    "calibre",
    "calibre-web",
    "calibre-web-automated",
    "library",
    "ebook",
    "automated",
]
requires-python = ">=3.10"
dependencies = [
    # <4: APScheduler 4 is a rewrite (async data stores, no BackgroundScheduler); see requirements.txt
    "APScheduler>=3.6.3,<3.12.0",
    "Babel>=1.3,<3.0",
    "Flask-Babel>=3.0.0,<4.1.0",
    "Flask-Principal>=0.3.2,<0.5.1",
    "Flask>=1.0.2,<3.2.0",
    "iso-639>=0.4.5,<0.5.0;python_version<'3.12'",
    "pycountry>=24.6.1,<25.0.0;python_version>='3.12'",
    "pypdf>=6.0.0",
    "pytz>=2016.10",
    "requests>=2.32.4,<3.0",
    "SQLAlchemy>=1.3.0,<2.1.0",
    "tornado>=6.4.2,<6.6",
    "Wand>=0.4.4,<0.7.0",
    "unidecode>=0.04.19,<1.4.0",
    "lxml>=5.3.0,<7.0",
    "flask-wtf>=0.14.2,<1.3.0",
    "chardet>=3.0.0,<5.3.0",
    "netifaces-plus>=0.12.0,<0.13.0",
    "urllib3>=2.5.0,<3.0",
    "Flask-Limiter>=2.3.0,<3.13.0",
    "regex>=2024.11.6",
    "bleach>=6.0.0,<6.3.0",
    "python-magic>=0.4.27,<0.5.0",
    "python-magic-bin>=0.4.0,<0.5.0;sys_platform=='win32'",
    "flask-httpAuth>=4.4.0,<5.0.0",
    "cryptography>=39.0.0,<44.0.0",
    "certifi>=2024.7.4",
    "charset-normalizer>=3.5.1",
    "idna>=3.7",
    "tabulate>=0.9.0",
    "polib>=1.2.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Bondyboy2001/lily"
"Bug Tracker" = "https://github.com/Bondyboy2001/lily/issues"
"Release Management" = "https://github.com/Bondyboy2001/lily/releases"
Upstream = "https://github.com/crocodilestick/Calibre-Web-Automated"
"Source Code" = "https://github.com/crocodilestick/Calibre-Web-Automated"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.optional-dependencies]
gdrive = [
    "google-api-python-client>=1.7.11,<2.200.0",
    "gevent>20.6.0,<24.12.0",
    "greenlet>=0.4.17,<3.2.0",
    "httplib2>=0.9.2,<0.23.0",
    "oauth2client>=4.1.3,<4.1.4",
    "uritemplate>=3.0.0,<4.2.0",
    "pyasn1-modules>=0.0.8,<0.7.0",
    "pyasn1>=0.1.9,<0.7.0",
    "PyDrive2>=1.3.1,<1.22.0",
    "PyYAML>=3.12,<6.1",
    "rsa>=3.4.2,<4.10.0",
]
similarity = [
    "python-Levenshtein>=0.12.0,<0.28.0",
]
metadata = [
    "rarfile>=3.2,<5.0",
    "markdown2>=2.0.0,<2.6.0",
    "html2text>=2020.1.16,<2025.2.26",
    "python-dateutil>=2.1,<2.10.0",
    "beautifulsoup4>=4.0.1,<4.14.0",
    "faust-cchardet>=2.1.18,<2.1.20",
    "py7zr>=0.15.0,<0.21.0",
    "mutagen>=1.40.0,<1.50.0",
]
comics = [
    "natsort>=2.2.0,<8.5.0",
    "comicapi>=2.2.0,<3.3.0",
]

[project.scripts]
cps = "cps.main:main"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "cps.constants.STABLE_VERSION"}

[tool.ruff]
target-version = "py313"
extend-exclude = ["cps/static", "cps/translations"]

[tool.ruff.lint]
# E9/F63/F7/F82/F811/F601/F523/B020: bug-catching rules (syntax errors, undefined
# names, shadowed definitions, repeated dict keys, bad format calls).
# F401/F841 were added once the existing unused imports and variables were cleared;
# they now keep dead imports and dead locals from coming back.
# W291/W293/W292 keep whitespace tidy (.editorconfig asks for it); F541 flags f-strings
# with nothing to interpolate; E401 flags `import a, b`; UP034 flags redundant parentheses.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F601", "F523", "F841", "B020",
          "W291", "W293", "W292", "F541", "E401", "UP034"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately keep a few unused locals: they are leftovers from iterative
# test writing, and removing the call could drop the behaviour under test.
"tests/**" = ["F841"]
# Generated data file; its generator decides the whitespace.
"cps/iso_language_names.py" = ["W291", "W292"]

# Type checking is introduced incrementally: run `mypy` (see requirements-dev.txt) on modules
# as they are refactored. Unlisted modules are ignored so legacy code does not block CI.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
files = ["scripts/book_integrity.py", "scripts/db_backup.py", "scripts/ingest_failures.py", "scripts/library_mirror.py", "scripts/metadata_suggestions.py"]
