[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lily"
description = "A self-hosted home for your books and papers"
authors = [{name = "Bondyboy2001"}]
license = {text = "GPLv3+"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = ["ebook", "library", "calibre", "self-hosted"]
requires-python = ">=3.10"
dependencies = [
    # <4: APScheduler 4 is a rewrite (async data stores, no BackgroundScheduler); see requirements.txt
    "APScheduler>=3.6.3,<3.12.0",
    "Babel>=1.3,<3.0",
    "Flask-Babel>=3.0.0,<4.1.0",
    "Flask-Principal>=0.3.2,<0.5.1",
    "Flask>=3.1.3,<3.2.0",
    "pypdf>=6.0.0",
    "requests>=2.32.4,<3.0",
    "SQLAlchemy>=2.0.54,<2.1.0",
    "tornado>=6.4.2,<6.6",
    "Wand>=0.4.4,<0.7.0",
    "unidecode>=0.04.19,<1.4.0",
    "lxml>=5.3.0,<7.0",
    "flask-wtf>=1.3.0,<1.4.0",
    "chardet>=3.0.0,<5.3.0",
    "netifaces-plus>=0.12.0,<0.13.0",
    "urllib3>=2.5.0,<3.0",
    "Flask-Limiter>=2.3.0,<3.13.0",
    "regex>=2024.11.6",
    "bleach>=6.0.0,<6.5.0",
    "python-magic>=0.4.27,<0.5.0",
    "python-magic-bin>=0.4.0,<0.5.0;sys_platform=='win32'",
    "flask-httpAuth>=4.4.0,<5.0.0",
    "cryptography>=39.0.0,<51.0.0",
    "certifi>=2024.7.4",
    "charset-normalizer>=3.5.1",
    "idna>=3.7",
    "tabulate>=0.9.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Bondyboy2001/lily"
Issues = "https://github.com/Bondyboy2001/lily/issues"
Upstream = "https://github.com/crocodilestick/calibre-web-automated"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.optional-dependencies]
gevent = [
    "gevent>=26.9.0,<26.10.0",
    "greenlet>=3.2.2,<3.6.0",
]
metadata = [
    "mutagen>=1.40.0,<1.50.0",
]
sorting = [
    "natsort>=2.2.0,<8.5.0",
]

[project.scripts]
cps = "cps.main:main"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "cps.constants.STABLE_VERSION"}

# Dead-code detection (see vulture_whitelist.py for the indirect references).
# Runs alongside ruff in CI. cps/cw_advocate and cps/cw_login are vendored
# third-party code; cps/static is generated/vendored.
[tool.vulture]
paths = ["cps", "scripts", "vulture_whitelist.py"]
exclude = ["cps/static", "cps/cw_advocate", "cps/cw_login"]
min_confidence = 60
ignore_decorators = [
    "@*.route", "@*.app_template_filter", "@*.errorhandler", "@*.before_request",
    "@*.after_request", "@*.before_app_request", "@*.url_defaults",
    "@*.context_processor", "@*.teardown_appcontext", "@*.register_error_handler",
    "@*.listens_for", "@*.command",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["cps/static"]

[tool.ruff.lint]
# E9/F63/F7/F82/F811/F601/F523/B020: bug-catching rules (syntax errors, undefined
# names, shadowed definitions, repeated dict keys, bad format calls).
# F401/F841 were added once the existing unused imports and variables were cleared;
# they now keep dead imports and dead locals from coming back.
# W291/W293/W292 keep whitespace tidy (.editorconfig asks for it); F541 flags f-strings
# with nothing to interpolate; E401 flags `import a, b`; UP034 flags redundant parentheses.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F601", "F523", "F841", "B020",
          "W291", "W293", "W292", "F541", "E401", "UP034"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately keep a few unused locals: they are leftovers from iterative
# test writing, and removing the call could drop the behaviour under test.
"tests/**" = ["F841"]
# Generated data file; its generator decides the whitespace.

# coverage.py (pytest --cov) reads these; it ignores [coverage:*] sections in pytest.ini.
[tool.coverage.run]
source = ["cps", "scripts"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "cps/static/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Type checking is introduced incrementally: run `mypy` (see requirements-dev.txt) on modules
# as they are refactored. Unlisted modules are ignored so legacy code does not block CI.
[tool.mypy]
# The image runs Python 3.13 (Dockerfile).
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
files = ["scripts/db_backup.py", "scripts/library_mirror.py", "scripts/metadata_suggestions.py",
         "scripts/cwa_internal_auth.py"]
