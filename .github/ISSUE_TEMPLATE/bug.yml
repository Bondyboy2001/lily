name: Bug
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: The image tag you run.
      placeholder: v4.4.0
  - type: textarea
    attributes:
      label: Log
      description: The relevant lines from `docker logs lily`.
      render: text
