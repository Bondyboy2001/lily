name: Release

# Every push to main publishes the image: the lint/type/unit checks run, an amd64
# build must start and answer /health, and only then are the amd64 and arm64 images
# tagged on GHCR and (when the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets exist)
# Docker Hub as <username>/lily, tagged :latest and :sha-<short>.
# Pushing a tag like v1.2.3 does the same and also adds :1.2.3 and :1.2.
#
# The version baked into the image (About, /health) comes from `git describe`, e.g.
# v4.4.0-3-gabc1234 for the third commit after v4.4.0.
#
# Each platform builds natively on its own runner (no QEMU), in parallel with the
# checks, and pushes by digest only; the amd64 job then pulls that digest and runs
# the /health smoke test on it. Nothing is tagged until the publish job, which waits
# for the checks and both builds and then ties the two digests together under the
# tags. A failed run leaves an untagged digest that no tag points at.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Releases run one at a time and a running one always finishes, so a quick run of pushes
# still publishes each finished build instead of cancelling until the pushes stop. Only
# the newest waiting run is kept: GitHub drops an older pending run when a newer one queues.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  on-main:
    name: Commit is on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      # git describe needs every commit and tag but no file contents: a blobless clone
      # takes seconds where the full one sometimes took most of a minute.
      - name: Checkout code (full history, no blobs)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check the commit is on origin/main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} ($GITHUB_SHA) is not on origin/main. Merge first, then tag main."
            exit 1
          fi

      - name: Version
        id: version
        run: echo "value=$(git describe --tags --match 'v*' --always)" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # uv installs the same pins as pip in a few seconds, and caches its wheels.
      # Every pinned package ships a wheel except flask-principal, which is pure
      # Python, so no system headers are needed.
      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            requirements.txt
            requirements.lock
            requirements-dev.txt

      - name: Run ruff
        run: uvx ruff==0.16.9 check cps scripts tests

      - name: Run mypy
        run: uvx mypy==2.3.1

      - name: Install dependencies
        run: |
          # Same pins as the image (requirements.lock)
          uv pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock
          uv pip check

      - name: Create test environment structure
        run: |
          sudo mkdir -p /config /books/import /books/ingest /config/processed_books
          sudo chmod -R 777 /config /books
          touch /config/cwa.db

      - name: Run smoke and unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
        run: pytest -m "smoke or unit" -n auto --tb=short

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [on-main]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build date
        id: date
        run: echo "value=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Image names
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "CACHE_REF=ghcr.io/${GITHUB_REPOSITORY,,}:buildcache-${platform#linux/}" >> "$GITHUB_ENV"
          names="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$HAS_DOCKERHUB" = true ]; then
            names="$names,docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lily"
          fi
          echo "IMAGE_NAMES=$names" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # VERSION ends up in /app/CWA_RELEASE (About, admin page, /health) and the image label
          build-args: |
            VERSION=${{ needs.on-main.outputs.version }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          outputs: type=image,"name=${{ env.IMAGE_NAMES }}",push-by-digest=true,name-canonical=true,push=true
          # The layer cache lives in GHCR, not the Actions cache: that one is capped at
          # 10 GB and was full, so the base layers kept being evicted and rebuilt. A
          # rebuilt layer has new timestamps and so a new digest even when nothing in it
          # changed, and every NAS update then downloaded ~185 MB instead of the ~6 MB
          # app layer. Only main writes the cache; tag builds read it. The Actions cache
          # is still read, so the first build after the switch reuses its layers.
          cache-from: |
            type=registry,ref=${{ env.CACHE_REF }}
            type=gha,scope=${{ matrix.platform == 'linux/amd64' && 'lily-image' || 'lily-image-arm64' }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE_REF) || '' }}

      # Checks the exact image that was just pushed: pulling it by digest is quicker
      # than a second build, and the tags only go on once this passes.
      - name: Smoke test (container starts, /health returns 200 and this version)
        if: matrix.platform == 'linux/amd64'
        env:
          EXPECTED: Lily/${{ needs.on-main.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST"
          docker pull -q "$image"
          mkdir -p smoke/config smoke/ingest smoke/library
          chmod -R 777 smoke
          docker run -d --name lily-smoke -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -v "$PWD/smoke/config:/config" -v "$PWD/smoke/ingest:/cwa-book-ingest" \
            -v "$PWD/smoke/library:/calibre-library" -p 8083:8083 \
            "$image"
          for i in $(seq 1 300); do
            if body=$(curl -fs http://localhost:8083/health); then
              echo "healthy after ~${i}s: $body"
              version=$(echo "$body" | jq -r .version)
              if [ "$version" != "$EXPECTED" ]; then
                echo "::error::/health reports '$version', expected '$EXPECTED'"
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health never returned 200"
          docker logs lily-smoke
          exit 1

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch tags
    runs-on: ubuntu-latest
    needs: [checks, build]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.HAS_DOCKERHUB == 'true' && format('docker.io/{0}/lily', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Create manifest lists and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Both registries got the same per-platform digests in the build job,
          # so GHCR's copies are the source for every tag.
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("ghcr.io/${GITHUB_REPOSITORY,,}@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
