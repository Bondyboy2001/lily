name: Release

# Every push to main publishes the image: the lint/type/unit checks run, an amd64
# build must start and answer /health, and only then are the amd64 and arm64 images
# tagged on GHCR and (when the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets exist)
# Docker Hub as <username>/lily, tagged :latest and :sha-<short>.
# Pushing a tag like v1.2.3 does the same and also adds :1.2.3 and :1.2.
#
# The version baked into the image (About, /health) comes from `git describe`, e.g.
# v4.4.0-3-gabc1234 for the third commit after v4.4.0.
#
# Each platform builds natively on its own runner (no QEMU), in parallel with the
# checks, and pushes by digest only. Nothing is tagged until the publish job, which
# waits for the checks and the smoke test and then ties the two digests together
# under the tags. A failed run leaves an untagged digest that no tag points at.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# A newer push to main replaces a release still in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  on-main:
    name: Commit is on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the commit is on origin/main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} ($GITHUB_SHA) is not on origin/main. Merge first, then tag main."
            exit 1
          fi

      - name: Version
        id: version
        run: echo "value=$(git describe --tags --match 'v*' --always)" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ruff
        run: pipx run ruff==0.16.9 check cps scripts tests

      - name: Run mypy
        run: pipx run mypy==2.3.1

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          python -m pip install --upgrade pip
          # Same pins as the image (requirements.lock)
          pip install -r requirements.txt -c requirements.lock
          pip install -r requirements-dev.txt -c requirements.lock
          pip check

      - name: Create test environment structure
        run: |
          sudo mkdir -p /config /books/import /books/ingest /config/processed_books
          sudo chmod -R 777 /config /books
          touch /config/cwa.db

      - name: Run smoke and unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
        run: pytest -m "smoke or unit" -n auto --tb=short

  image-smoke:
    name: Build image and check /health
    runs-on: ubuntu-latest
    needs: [on-main]
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build date
        id: date
        run: echo "value=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lily:release-smoke
          build-args: |
            VERSION=${{ needs.on-main.outputs.version }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha,scope=lily-image
          cache-to: type=gha,scope=lily-image,mode=max

      - name: Smoke test (container starts, /health returns 200 and this version)
        env:
          EXPECTED: Lily/${{ needs.on-main.outputs.version }}
        run: |
          mkdir -p smoke/config smoke/ingest smoke/library
          chmod -R 777 smoke
          docker run -d --name lily-smoke -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -v "$PWD/smoke/config:/config" -v "$PWD/smoke/ingest:/cwa-book-ingest" \
            -v "$PWD/smoke/library:/calibre-library" -p 8083:8083 \
            lily:release-smoke
          for i in $(seq 1 60); do
            if body=$(curl -fs http://localhost:8083/health); then
              echo "healthy after ~$((i * 5))s: $body"
              version=$(echo "$body" | jq -r .version)
              if [ "$version" != "$EXPECTED" ]; then
                echo "::error::/health reports '$version', expected '$EXPECTED'"
                exit 1
              fi
              exit 0
            fi
            sleep 5
          done
          echo "::error::/health never returned 200"
          docker logs lily-smoke
          exit 1

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [on-main]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # amd64 reads main's "lily-image" scope, which image-smoke (and tests.yml) save.
          # arm64 has no other writer, so it saves its own scope on main pushes; without
          # that every arm64 build started cold. Tag runs only read: a tag can restore
          # caches saved on main but never ones saved on an earlier tag.
          - platform: linux/amd64
            runner: ubuntu-latest
            cache_scope: lily-image
            save_cache: false
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: lily-image-arm64
            save_cache: true
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build date
        id: date
        run: echo "value=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Image names
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          names="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$HAS_DOCKERHUB" = true ]; then
            names="$names,docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lily"
          fi
          echo "IMAGE_NAMES=$names" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # VERSION ends up in /app/CWA_RELEASE (About, admin page, /health) and the image label
          build-args: |
            VERSION=${{ needs.on-main.outputs.version }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          outputs: type=image,"name=${{ env.IMAGE_NAMES }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: ${{ matrix.save_cache && github.ref == 'refs/heads/main' && format('type=gha,scope={0},mode=max', matrix.cache_scope) || '' }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch tags
    runs-on: ubuntu-latest
    needs: [checks, image-smoke, build]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.HAS_DOCKERHUB == 'true' && format('docker.io/{0}/lily', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Create manifest lists and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Both registries got the same per-platform digests in the build job,
          # so GHCR's copies are the source for every tag.
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("ghcr.io/${GITHUB_REPOSITORY,,}@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}:latest"
