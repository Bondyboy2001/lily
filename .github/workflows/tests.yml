name: Test Suite

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests'
        required: false
        type: boolean
        default: false

# Cancel in-progress runs when new commit pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Lint: rules that catch real bugs (undefined names, syntax errors,
  # shadowed definitions). Ruleset lives in pyproject.toml [tool.ruff].
  # ============================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ruff
        run: pipx run ruff==0.16.9 check cps scripts tests

      # Dead-code detection: unused functions, methods, classes, attributes and
      # variables (config + whitelist in pyproject.toml [tool.vulture]).
      - name: Run vulture
        run: pipx run vulture==2.16

      # Newer, self-contained modules are type-checked (file list in pyproject.toml [tool.mypy]).
      # cps/ modules run separately because mypy maps cps/ and scripts/ to clashing module names.
      - name: Run mypy
        run: |
          pipx run mypy

  # ============================================================================
  # Dependency audit: known-vulnerable pins in requirements.lock.
  # Informational (continue-on-error) because Google Drive's old caps may
  # hold a few packages back; read the output rather than gating merges on it.
  # ============================================================================
  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run pip-audit
        run: pipx run pip-audit -r requirements.lock --no-deps --disable-pip

  # ============================================================================
  # JOB 1: Fast Tests (Smoke + Unit)
  # Runs on: Every push, every PR
  # Duration: ~2 minutes
  # Purpose: Catch basic errors immediately
  # ============================================================================
  fast-tests:
    name: Fast Tests (Smoke + Unit)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Remove Python bytecode and pycache
        run: |
          echo "Removing any leftover .pyc and pycache"
          find . -name '__pycache__' -type d -print -exec rm -rf {} +
          find . -name '*.pyc' -type f -print -delete
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same pins as the Docker image (requirements.lock), so CI tests what ships
          pip install -r requirements.txt -c requirements.lock
          pip install -r requirements-dev.txt -c requirements.lock
          # Fail fast if the resolver produced an incompatible pyOpenSSL/cryptography pair
          pip check
          python -c "import OpenSSL, cryptography; print('pyOpenSSL', OpenSSL.__version__, 'cryptography', cryptography.__version__)"
      
      - name: Create test environment structure
        run: |
          sudo mkdir -p /config /books/import /books/ingest /config/processed_books
          sudo chmod -R 777 /config /books
          touch /config/cwa.db
      
      - name: Run smoke and unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
        run: |
          # No --maxfail: report every failing test, not just the first few.
          # (tests under tests/unit and tests/smoke are auto-marked unit/smoke in conftest.py)
          pytest -m "smoke or unit" \
            -n auto \
            -v \
            --tb=short \
            --cov=cps \
            --cov-report=term-missing
      

  # ============================================================================
  # Docker build check
  # Runs on: every PR (integration below only runs on main/dev)
  # Purpose: a broken Dockerfile, pin or apt package fails the PR, not the merge.
  # BuildKit layers are cached in the GitHub Actions cache under the same scope
  # the integration job writes on main/dev, so most PR builds only redo the
  # layers the PR actually touches.
  # ============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lily:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=lily-image
          cache-to: type=gha,scope=lily-image,mode=max

      - name: Smoke test (container starts and /health returns 200)
        run: |
          mkdir -p smoke/config smoke/ingest smoke/library
          chmod -R 777 smoke
          docker run -d --name lily-smoke -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$PWD/smoke/config:/config" -v "$PWD/smoke/ingest:/cwa-book-ingest" \
            -v "$PWD/smoke/library:/calibre-library" -p 8083:8083 \
            lily:pr-${{ github.event.pull_request.number }}
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8083/health)" = "200" ]; then
              echo "healthy after ~$((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "::error::/health never returned 200"
          docker logs lily-smoke
          exit 1

      - name: Browser smoke test (sign in, visit pages, fail on CSP violations)
        working-directory: tests/e2e
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8083 node smoke.mjs || { docker logs lily-smoke; exit 1; }

  # ============================================================================
  # JOB 2: Integration Tests (Docker)
  # Runs on: Merge to main/dev, manual trigger
  # Duration: ~15-20 minutes
  # Purpose: Validate real-world behavior in Docker container
  # ============================================================================
  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    # Only run on merge to main/dev OR manual dispatch with flag
    if: |
      github.ref == 'refs/heads/main' || 
      github.ref == 'refs/heads/dev' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock
            requirements-dev.txt
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock
          pip install -r requirements-dev.txt -c requirements.lock
          pip install --force-reinstall --no-cache-dir docker

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lily:latest
          cache-from: type=gha,scope=lily-image
          cache-to: type=gha,scope=lily-image,mode=max

      - name: Set test UID/GID
        run: |
          echo "CWA_TEST_PUID=$(id -u)" >> $GITHUB_ENV
          echo "CWA_TEST_PGID=$(id -g)" >> $GITHUB_ENV
      
      - name: Run Docker integration tests
        run: |
          # CRITICAL: No -n flag! Docker tests must run sequentially
          pytest tests/docker/ tests/integration/ \
            -v \
            --tb=long \
            --durations=10 \
            --junitxml=integration-results.xml
        env:
          CWA_TEST_PORT: "8083"  # CI uses production default port
          CWA_TEST_IMAGE: "lily:latest"
        timeout-minutes: 30  # Kill if stuck
      
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: |
            integration-results.xml
            tests/logs/
            tests/tmp/
          retention-days: 7


  # ============================================================================
  # Summary Job (Optional)
  # Shows overall status in GitHub UI
  # ============================================================================
  test-summary:
    name: Test Suite Summary
    runs-on: ubuntu-latest
    needs: [lint, dependency-audit, fast-tests, docker-build, integration-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Fast Tests: ${{ needs.fast-tests.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"

          failed=0
          for job in "lint=${{ needs.lint.result }}" "fast-tests=${{ needs.fast-tests.result }}" \
                     "docker-build=${{ needs.docker-build.result }}" \
                     "integration-tests=${{ needs.integration-tests.result }}"; do
            # "skipped" is fine: docker-build only runs on PRs, integration only on main/dev or when requested
            if [[ "${job#*=}" == "failure" || "${job#*=}" == "cancelled" ]]; then
              echo "❌ ${job%%=*} ${job#*=}"
              failed=1
            fi
          done
          if [[ $failed == 1 ]]; then
            exit 1
          fi

          echo "✅ Test suite completed"
