name: Test Suite

on:
  push:
    branches: ['**']  # Run Job 1 on all branches
  pull_request:
    branches: [main, dev]  # Run Job 1 on PRs to main/dev
  workflow_dispatch:  # Manual trigger button in Actions tab
    inputs:
      run_integration:
        description: 'Run integration tests'
        required: false
        type: boolean
        default: false

# Cancel in-progress runs when new commit pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Lint: rules that catch real bugs (undefined names, syntax errors,
  # shadowed definitions). Ruleset lives in pyproject.toml [tool.ruff].
  # ============================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ruff
        run: pipx run ruff==0.16.9 check cps scripts tests

  # ============================================================================
  # JOB 1: Fast Tests (Smoke + Unit)
  # Runs on: Every push, every PR
  # Duration: ~2 minutes
  # Purpose: Catch basic errors immediately
  # ============================================================================
  fast-tests:
    name: Fast Tests (Smoke + Unit)
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove Python bytecode and pycache
        run: |
          echo "Removing any leftover .pyc and pycache"
          find . -name '__pycache__' -type d -print -exec rm -rf {} +
          find . -name '*.pyc' -type f -print -delete
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          # Fail fast if the resolver produced an incompatible pyOpenSSL/cryptography pair
          pip check
          python -c "import OpenSSL, cryptography; print('pyOpenSSL', OpenSSL.__version__, 'cryptography', cryptography.__version__)"
      
      - name: Create test environment structure
        run: |
          sudo mkdir -p /config /books/import /books/ingest /config/processed_books
          sudo chmod -R 777 /config /books
          touch /config/cwa.db
      
      - name: Run smoke and unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
        run: |
          # No --maxfail: report every failing test, not just the first few.
          # (tests under tests/unit and tests/smoke are auto-marked unit/smoke in conftest.py)
          pytest -m "smoke or unit" \
            -n auto \
            -v \
            --tb=short \
            --cov=cps \
            --cov-report=xml \
            --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: fast-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && failure()
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Fast tests failed!** Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and fix before merging.'
            })

  # ============================================================================
  # JOB 2: Integration Tests (Docker)
  # Runs on: Merge to main/dev, manual trigger
  # Duration: ~15-20 minutes
  # Purpose: Validate real-world behavior in Docker container
  # ============================================================================
  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    # Only run on merge to main/dev OR manual dispatch with flag
    if: |
      github.ref == 'refs/heads/main' || 
      github.ref == 'refs/heads/dev' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_integration)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install --force-reinstall --no-cache-dir docker

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: lily:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set test UID/GID
        run: |
          echo "CWA_TEST_PUID=$(id -u)" >> $GITHUB_ENV
          echo "CWA_TEST_PGID=$(id -g)" >> $GITHUB_ENV
      
      - name: Run Docker integration tests
        run: |
          # CRITICAL: No -n flag! Docker tests must run sequentially
          pytest tests/docker/ tests/integration/ \
            -v \
            --tb=long \
            --durations=10 \
            --junitxml=integration-results.xml
        env:
          CWA_TEST_PORT: "8083"  # CI uses production default port
          CWA_TEST_IMAGE: "lily:latest"
        timeout-minutes: 30  # Kill if stuck
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            integration-results.xml
            tests/logs/
            tests/tmp/
          retention-days: 7
      
      - name: Notify on failure
        uses: sarisia/actions-status-discord@v1
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "❌ Integration tests failed on ${{ github.ref_name }}"
          description: |
            **Commit**: ${{ github.sha }}
            **Author**: ${{ github.actor }}
            **Branch**: ${{ github.ref_name }}
            
            [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xFF0000
          username: GitHub Actions

  # ============================================================================
  # Summary Job (Optional)
  # Shows overall status in GitHub UI
  # ============================================================================
  test-summary:
    name: Test Suite Summary
    runs-on: ubuntu-latest
    needs: [lint, fast-tests, integration-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Fast Tests: ${{ needs.fast-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"

          failed=0
          for job in "lint=${{ needs.lint.result }}" "fast-tests=${{ needs.fast-tests.result }}" \
                     "integration-tests=${{ needs.integration-tests.result }}"; do
            # "skipped" is fine: integration only runs on main/dev or when requested
            if [[ "${job#*=}" == "failure" || "${job#*=}" == "cancelled" ]]; then
              echo "❌ ${job%%=*} ${job#*=}"
              failed=1
            fi
          done
          if [[ $failed == 1 ]]; then
            exit 1
          fi

          echo "✅ Test suite completed"
