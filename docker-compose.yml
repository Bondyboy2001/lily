services:
  lily:
    image: coldestpillow/lily:latest   # or ghcr.io/bondyboy2001/lily:latest
    # build: .                         # build from source instead: docker compose up -d --build
    container_name: lily
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      # Optional, see docs/deployment.md
      # - HARDCOVER_TOKEN=your_hardcover_api_key   # Hardcover metadata
      # - CROSSREF_MAILTO=you@example.org          # paper metadata
      # - SEMANTIC_SCHOLAR_API_KEY=your_key        # paper metadata
      # - TRUSTED_PROXY_COUNT=1                    # behind a reverse proxy
      # - SESSION_COOKIE_SECURE=true               # served over HTTPS
      # - NETWORK_SHARE_MODE=true                  # library on NFS/SMB
      # - DB_BACKUP_DIR=/backups                   # nightly snapshots off the config volume
    volumes:
      - /path/to/config:/config
      - /path/to/ingest:/cwa-book-ingest    # emptied after each import
      - /path/to/library:/calibre-library   # an existing Calibre library, or an empty folder
      # - /path/to/backups:/backups
    ports:
      - 8083:8083
    restart: unless-stopped
