---
services:
  lily:
    image: lily:latest
    build: .
    container_name: lily
    environment:
      # Only change these if you know what you're doing
      - PUID=1000
      - PGID=1000
      # Edit to match your current timezone e.g. Europe/London, America/New_York - https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=Europe/London
      # Sets the listening port for the application. Defaults to 8083.
      # - CWA_PORT_OVERRIDE=8083
      # Hardcover API Key required for Hardcover as a Metadata Provider, get one here: https://docs.hardcover.app/api/getting-started/
      # - HARDCOVER_TOKEN=your_hardcover_api_key_here
      # If your library is on a network share (e.g., NFS/SMB), disables WAL and chown to reduce locking/permission issues,
      # and switches file watching to polling (more reliable on network mounts) instead of inotify.
      # Accepts: true/false (default: false)
      - NETWORK_SHARE_MODE=false
      # If you want to force polling mode regardless of share type, set CWA_WATCH_MODE=poll
      # - CWA_WATCH_MODE=poll
      # Number of reverse proxies in front of Lily whose X-Forwarded-* headers should be trusted (default: 0 = none).
      # If you run Lily behind a reverse proxy (nginx, Caddy, Traefik, ...), set this to 1; for Cloudflare Tunnel +
      # reverse proxy use 2. Leave at 0 if Lily is accessed directly, otherwise clients could spoof their IP.
      # - TRUSTED_PROXY_COUNT=1
      # Comma-separated CIDRs allowed to send the reverse-proxy login header (only used if reverse proxy authentication
      # is enabled in the admin settings). Default: loopback only; list your proxy's address, e.g. 172.18.0.5/32.
      # - TRUSTED_PROXY_IPS=127.0.0.0/8,::1/128,172.18.0.5/32
      # Set to true when serving Lily over HTTPS so session / remember-me cookies are marked Secure (default: false)
      # - SESSION_COOKIE_SECURE=true
      # Skip the automatic library detection/mount at startup. When enabled, the auto-library service will not run.
      # Accepts: true/yes/1 to disable auto-mount (default: false)
      # - DISABLE_LIBRARY_AUTOMOUNT=false
      # Where nightly database snapshots go (default: /config/backup/db). Point it at a separate volume, below,
      # so a lost or corrupted /config volume doesn't take the backups with it.
      # - DB_BACKUP_DIR=/backups
    volumes:
      # Calibre-Web / CWA users migrating should stop their existing CW instance, make a copy of the config folder, and bind that here to carry over all of their user settings etc.
      - /path/to/config/folder:/config
      # This is an ingest dir, NOT a library one. Anything added here will be automatically added to your library according to the settings you have configured in Lily Settings page. All files placed here are REMOVED AFTER PROCESSING
      - /path/to/the/folder/you/want/to/use/for/book/ingest:/cwa-book-ingest
      # If you don't have an existing library, Lily will automatically create one at the bind provided here
      - /path/to/your/calibre/library:/calibre-library
      # If you use calibre plugins, you can bind your plugins folder here to have Lily attempt to add them to it's workflow (WIP)
      # If you are starting with a fresh install, you also need to copy customize.py.json to the Calibre config volume above, in /path/to/config/folder/.config/calibre/customize.py.json, see the README for more info
      - /path/to/your/calibre/plugins/folder:/config/.config/calibre/plugins
      # Optional: separate volume for database snapshots, used with DB_BACKUP_DIR=/backups above
      # - /path/to/your/backup/folder:/backups
    ports:
      # Change the first number to change the port you want to access the Web UI, not the second
      - 8083:8083
    # If you set CWA_PORT_OVERRIDE to a port below 1024, you may need to uncomment the following line:
    # cap_add:
    #   - NET_BIND_SERVICE
    restart: unless-stopped
